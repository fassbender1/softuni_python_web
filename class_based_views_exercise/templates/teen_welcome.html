<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome, Teens!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5; /* Light gray background */
            font-family: 'Arial', sans-serif;
        }
        .welcome-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: 50px;
        }
        .welcome-heading {
            color: #6a0dad; /* Purple */
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .welcome-text {
            color: #333333;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .btn-custom {
            background-color: #00bfff; /* Deep Sky Blue */
            border-color: #00bfff;
            color: white;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 50px;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #009acd;
            border-color: #009acd;
        }
    </style>
</head>
<body>
    <div class="container welcome-container text-center">
        <h1 class="welcome-heading">Hey there, awesome teen! 👋</h1>
        <p class="welcome-text">
            Welcome to our cool space! Get ready to explore, learn, and connect.
            We've got loads of interesting stuff just for you. Dive in and have fun!
        </p>
        <button class="btn btn-custom mt-4">Let's Go!</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
