{% extends 'base.html' %}

{% block content %}
    <h4>Delete Review</h4>
    <p>Are you sure you want to delete this review?</p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-danger">
            Delete Review
        </button>
        <a href="{% url 'reviews:list_all' %}" class="btn btn-secondary">Cancel</a>
    </form>


{% endblock %}
